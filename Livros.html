      <!-- MODAL APAGAR -->
      <div class="modal" id="modal2">
        <div class="modal-content">
          <header class="modal-header">
            <h2>Excluir Livro</h2>
            <span class="modal-close" id="modalClose2">&#10006;</span>
          </header>
          <div id="avisoDelete">
            <!-- aviso de delete -->
          </div>
          <footer class="modal-footer">
            <button id="apagar" class="button red">Apagar</button>
            <button id="cancelar2" class="button blue">Cancelar</button>
          </footer>
        </div>
      </div>
      <div class="modal-content">
        <header class="modal-header">
          <h2>Novo Livro</h2>
          <span class="modal-close" id="modalClose">&#10006;</span>
        </header>
        <form id="form" class="modal-form">
          <input
            type="number"
            id="codigo"
            class="modal-field"
            placeholder="Código do Livro"
            required
          />
          <input
            type="text"
            id="nome"
            data-index="new"
            class="modal-field"
            placeholder="Nome do Livro"
            required
          />
          <input
            type="date"
            id="ano"
            class="modal-field"
            placeholder="Ano de Publicação do Livro"
            required
          />
          <input
            type="text"
            id="categoria"
            class="modal-field"
            placeholder="Categoria do Livro"
            required
          />
          <input
            type="text"
            id="editora"
            class="modal-field"
            placeholder="Editora do Livro"
            required
          />
          <input
            type="text"
            id="isbn"
            class="modal-field"
            placeholder="ISBN do Livro"
            required
          />
          <input
            type="text"
            id="autor"
            class="modal-field"
            placeholder="Autor do Livro"
            required
          />
        </form>
        <footer class="modal-footer">
          <button id="salvar" class="button green">Salvar</button>
          <button id="cancelar" class="button blue">Cancelar</button>
        </footer>
      </div>
