<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- compatibilidade -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- ícone de imagem na guia do navegador -->
    <link rel="icon" href="img/livro.ico">
    
    <!-- Link de acesso a folha css (login.css) -->
    <link rel="stylesheet" href="./css/login.css">
    
    <title>Biblioteca Seduc - Login</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="title">
                <span> Faça seu Login </span>
            </div>
            <form action="Dashboard.html">
                <div class="row">
                    <div class="i"><i class="fa-solid fa-user" style="color: white;"></i></div>
                    <input type="text" placeholder="E-mail" id="email" required>
                </div>
                <div class="row">
                    <div class="i"><i class="fa-solid fa-lock" style="color: white;"></i></div>
                    <input type="password" placeholder="Senha" id="senha" required>
                </div>
                <div class="row button">
                    <div class="pass"><p>Esqueceu a Senha?</p></div>
                    <input type="submit" value="login" onclick="logar(); return false">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
