<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="icon" href="img/livro.ico" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/crud.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <link rel="stylesheet" href="./css/records.css" />
    <link rel="stylesheet" href="./css/button.css" />
    <script src="./js/main.js" defer></script>
    <script src="./js/alunos.js" defer></script>
    <title>Biblioteca Escolar</title>
</head>
<body>
    <div class="corpo">
        <nav>
            <div class="menu-sid">
                <i class="bi bi-list sidebar-toggle"></i>
            </div>
            <div class="div-logo-name">
                <span class="logo-name"> Biblioteca </span>
            </div>
            <div class="menu-items">
                <ul class="nav-links">
                    <li><a href="Dashboard.html"><i class="bi bi-house"></i><span class="link-name">Dashboard</span></a></li>
                    <li><a href="Alunos.html"><i class="bi bi-person-vcard"></i><span class="link-name">Alunos</span></a></li>
                    <li><a href="Funcionarios.html"><i class="bi bi-person-vcard"></i><span class="link-name">Funcionários</span></a></li>
                    <li><a href="Editoras.html"><i class="bi bi-clipboard-data"></i><span class="link-name">Editoras</span></a></li>
                    <li><a href="Livros.html"><i class="bi bi-clipboard-data"></i><span class="link-name">Livros</span></a></li>
                    <li><a href="Emprestimos.html"><i class="bi bi-person-workspace"></i><span class="link-name">Empréstimos</span></a></li>
                </ul>
            </div>
        </nav>

        <section class="dashboard">
            <div class="top">
                <i class="bi bi-list sidebar-toggle2"></i>
                <div class="logo-name">
                    <h1 class="seduc-logo">Biblioteca Escolar</h1>
                </div>
                <div class="actionimg">
                    <div class="profile" onclick="menuToggle()">
                        <img src="img/avatar5.png" alt="" />
                    </div>
                    <div class="menu">
                        <h3>Antonio Carlos</h3>
                        <ul>
                            <li><i class="bi bi-person"></i><a href="#">Perfil</a></li>
                            <li><i class="bi bi-question-circle"></i><a href="#">Ajuda</a></li>
                            <li><i class="bi bi-gear"></i><a href="#">Configurações</a></li>
                            <li><i class="bi bi-box-arrow-right"></i><a href="index.html">Saída</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="corpo-da-pag">
                <div class="scroll">
                    <div class="activity">
                        <div class="overview">
                            <div class="title">
                                <i class="bi bi-person-rolodex"></i>
                                <span class="text">Alunos</span>
                            </div>
                            <div class="seducServer">
                                <a href="Dashboard.html">Biblioteca Escolar</a> > <a href="Alunos.html">Alunos</a>
                            </div>
                        </div>

                        <div id="lupa-grid">
                            <button type="button" class="button blue" id="cadastrarAluno">Cadastrar Novo Aluno</button>
                        </div>
                        <br />

                        <table id="tableAluno" class="records">
                            <thead>
                                <tr><th>Nome</th><th>Matrícula</th><th>Curso</th><th>Série</th><th>Celular</th><th>E-mail</th><th>Ação</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>

                        <!-- MODAL EXCLUIR -->
                        <div class="modal" id="modal2">
                            <div class="modal-content">
                                <header class="modal-header">
                                    <h2>Excluir Aluno</h2>
                                    <span class="modal-close" id="modalClose2">&#10006;</span>
                                </header>
                                <div id="avisoDelete"></div>
                                <footer class="modal-footer">
                                    <button id="apagar" class="button red">Apagar</button>
                                    <button id="cancelar2" class="button blue">Cancelar</button>
                                </footer>
                            </div>
                        </div>

                        <!-- MODAL CRIAR/EDITAR -->
                        <div class="modal" id="modal">
                            <div class="modal-content">
                                <header class="modal-header">
                                    <h2>Novo Aluno</h2>
                                    <span class="modal-close" id="modalClose">&#10006;</span>
                                </header>
                                <form id="form" class="modal-form">
                                    <input type="text" id="nome" data-index="new" class="modal-field" placeholder="Nome do Aluno" required />
                                    <input type="number" id="matricula" class="modal-field" placeholder="Matrícula" required />
                                    <input type="text" id="telefone" class="modal-field" placeholder="Telefone" />
                                    <input type="text" id="celular" class="modal-field" placeholder="Celular" required />
                                    <input type="email" id="email" class="modal-field" placeholder="E-mail" required />
                                    <input type="text" id="rua" class="modal-field" placeholder="Endereço" required />
                                    <input type="text" id="numero" class="modal-field" placeholder="Número" required />
                                    <input type="text" id="complemento" class="modal-field" placeholder="Complemento" />
                                    <input type="text" id="cidade" class="modal-field" placeholder="Cidade" required />
                                    <input type="text" id="estado" class="modal-field" placeholder="Estado" required />
                                    <input type="text" id="curso" class="modal-field" placeholder="Curso" required />
                                    <input type="number" id="serie" class="modal-field" placeholder="Série" required />
                                </form>
                                <footer class="modal-footer">
                                    <button type="button" id="salvar" class="button green">Salvar</button>
                                    <button type="button" id="cancelar" class="button blue">Cancelar</button>
                                </footer>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
