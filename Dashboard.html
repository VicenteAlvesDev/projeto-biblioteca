<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Escolar</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="img/livro.ico" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/bower_components/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bower_components/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/bower_components/Ionicons/css/ionicons.min.css">
    <link rel="stylesheet" href="css/alt/AdminLTE.min.css">
    <script src="./js/dashboard.js" defer></script>
    <script src="./js/main.js" defer></script>
</head>
<body>
    <div class="corpo">
        <nav>
            <div class="menu-sid">
                <i class="bi bi-list sidebar-toggle"></i>
            </div>
            <div class="div-logo-name">
                <span class="logo-name">Biblioteca</span>
            </div>
            <div class="menu-items">
                <ul class="nav-links">
                    <li><a href="Dashboard.html"><i class="bi bi-house"></i><span class="link-name">Dashboard</span></a></li>
                    <li><a href="Alunos.html"><i class="bi bi-person-vcard"></i><span class="link-name">Alunos</span></a></li>
                    <li><a href="Funcionarios.html"><i class="bi bi-person-vcard"></i><span class="link-name">Funcionários</span></a></li>
                    <li><a href="Editoras.html"><i class="bi bi-clipboard-data"></i><span class="link-name">Editoras</span></a></li>
                    <li><a href="Livros.html"><i class="bi bi-book"></i><span class="link-name">Livros</span></a></li>
                    <li><a href="Emprestimos.html"><i class="bi bi-person-workspace"></i><span class="link-name">Empréstimos</span></a></li>
                </ul>
            </div>
        </nav>

        <section class="dashboard">
            <div class="top">
                <i class="bi bi-list sidebar-toggle2"></i>
                <div class="logo-name">
                    <h1 class="seduc-logo">Biblioteca Escolar</h1>
                </div>
                <div class="actionimg">
                    <div class="profile" onclick="menuToggle();">
                        <img src="img/avatar5.png" alt="">
                    </div>
                    <div class="menu">
                        <h3>Antônio Carlos</h3>
                        <ul>
                            <li><i class="bi bi-person"></i><a href="#">Perfil</a></li>
                            <li><i class="bi bi-question-circle"></i><a href="#">Ajuda</a></li>
                            <li><i class="bi bi-gear"></i><a href="#">Configurações</a></li>
                            <li><i class="bi bi-box-arrow-right"></i><a href="index.html">Saída</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="corpo-da-pag">
                <div class="scroll">
                    <div class="activity">
                        <div class="overview">
                            <div class="title">
                                <i class="bi bi-house"></i>
                                <span class="text">Dashboard</span>
                            </div>
                            <section class="content container-fluid">
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div class="small-box bg-green">
                                            <div class="inner">
                                                <h3 id="number-emprestimo">0</h3>
                                                <p>Empréstimos</p>
                                            </div>
                                            <div class="icon">
                                                <i class="ion ion-pie-graph"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-6">
                                        <div class="small-box bg-yellow">
                                            <div class="inner">
                                                <h3 id="number-alunos">0</h3>
                                                <p>Alunos</p>
                                            </div>
                                            <div class="icon">
                                                <i class="ion ion-person-add"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-6">
                                        <div class="small-box bg-green">
                                            <div class="inner">
                                                <h3 id="number-editoras">0</h3>
                                                <p>Editoras</p>
                                            </div>
                                            <div class="icon">
                                                <i class="ion ion-home"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-6">
                                        <div class="small-box bg-yellow">
                                            <div class="inner">
                                                <h3 id="number-funcionario">0</h3>
                                                <p>Funcionários</p>
                                            </div>
                                            <div class="icon">
                                                <i class="ion ion-person-add"></i>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-xs-6">
                                        <div class="small-box bg-green">
                                            <div class="inner">
                                                <h3 id="number-livros">0</h3>
                                                <p>Livros</p>
                                            </div>
                                            <div class="icon">
                                                <i class="ion-ios-book"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
