<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Seduc - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="title">
                <span>Faça seu Login</span>
            </div>
            <form id="loginForm">
                <div class="row">
                    <div class="i"><i class="fa-solid fa-user"></i></div>
                    <input type="text" placeholder="E-mail" id="email" required>
                </div>
                <div class="row">
                    <div class="i"><i class="fa-solid fa-lock"></i></div>
                    <input type="password" placeholder="Senha" id="senha" required>
                </div>
                <div class="row button">
                    <div class="pass"><p>Esqueceu a Senha?</p></div>
                    <input type="submit" value="Entrar">
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            // Validação simples
            if (email === "admin@biblioteca.com" && senha === "admin123") {
                window.location.href = "Dashboard.html";
            } else {
                alert("E-mail ou senha incorretos!\n\nUse:\nE-mail: admin@biblioteca.com\nSenha: admin123");
            }
        });
    </script>
</body>
</html>
